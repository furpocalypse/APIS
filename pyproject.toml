[project]
name = "apis"
version = "0.25.0"
description = "Attendee registration software for fan conventions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "configobj>=5.0.9",
    "django>=5.0.0,<6.0.0",
    "django-admin-env-notice>=1.0.1",
    "django-debug-toolbar>=5.2.0",
    "django-extensions>=3.2.3",
    "django-idempotency-key>=1.3.0",
    "django-import-export>=4.3.7",
    "django-maintenance-mode>=0.22.0",
    "django-mathfilters>=1.0.0",
    "django-nested-admin>=4.1.1",
    "django-nested-inline>=0.4.6",
    "django-prometheus>=2.3.1",
    "django-widget-tweaks>=1.5.0",
    "freezegun>=1.4.0",
    "gotenberg-client>=0.7.0",
    "influxdb>=5.3.1",
    "influxdb-client>=1.40.0",
    "paho-mqtt>=1.6.1",
    "paypal-server-sdk==2.2.0",
    "pillow>=5.3",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.12.5",
    "pygments>=2.18.0",
    "pyjwt>=2.8.0",
    "qrcode>=7.4.2",
    "respx>=0.22.0",
    "ruff>=0.9.6",
    "sentry-sdk>=2.21.0",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "coveralls>=4.0.2",
    "sphinx>=9.0.4",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-django>=2.5",
]
test = [
    "coveralls>=4.0.2"
]
