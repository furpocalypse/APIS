[project]
name = "apis"
version = "0.25.0"
description = "Attendee registration software for fan conventions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "celery[redis]>=5.6.3",
    "configobj>=5.0.9",
    "django~=6.0.3",
    "django-admin-env-notice~=1.0.1",
    "django-allauth[mfa]>=65.14.3",
    "django-axes~=8.3",
    "django-csp~=4.0",
    "django-extensions~=4.1",
    "django-idempotency-key~=1.3.0",
    "django-import-export~=4.4.0",
    "django-maintenance-mode~=0.22.0",
    "django-mathfilters~=1.0.0",
    "django-nested-admin>=4.1.1",
    "django-nested-inline~=0.4.6",
    "django-prometheus~=2.5.0",
    "django-ratelimit~=4.1",
    "django-redis~=6.0.0",
    "django-vite>=3.1.0",
    "django-widget-tweaks~=1.5.1",
    "gotenberg-client~=0.13.1",
    "gunicorn>=25.0.1",
    "influxdb~=5.3.1",                # legacy v1 client (InfluxDBReporter, deprecated)
    "influxdb-client~=1.50.0",        # v2 client (unused; kept for backward-compat)
    "influxdb3-python~=0.13",         # v3 client (InfluxDBv3Reporter — current path)
    "markuppy>=1.14",
    "paho-mqtt~=2.1.0",
    "paypal-server-sdk==2.2.0",
    "pillow>=12.1.0",
    "psycopg[binary,pool]>=3.3.3",
    "pydantic>=2.12.5",
    "pygments~=2.20.0",
    "pyjwt~=2.13.0",
    "pytz~=2026.1.post1",
    "qrcode~=8.2.0",
    "sentry-sdk>=2.54.0",
    "soupsieve>=2.8.3",
    "squareup==44.0.1.20260122",
    "uvicorn>=0.40.0",
    "uvicorn-worker>=0.4.0",
    # WhiteNoise serves /static/ from gunicorn. Necessary because nginx
    # is now a separate image (it doesn't have access to /app/apis/static
    # the way the bundled-nginx setup did). [brotli] adds br/gz pre-comp
    # at collectstatic time so gunicorn doesn't compress per-request.
    "whitenoise[brotli]>=6.7.0",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.6.0",
    "coveralls>=4.1.0",
    "django-debug-toolbar~=6.2.0",
    "django-stubs[compatible-mypy]>=6.0.4",
    # mypy 2.0.0 INTERNAL-ERRORs on this codebase (CI lint.yml mypy job
    # crashed with exit 2). Pin to the stable 1.x line until 2.x is
    # crash-free; mypy is a Phase-B continue-on-error job so this only
    # affects whether it produces usable (non-blocking) output.
    "mypy>=1.15,<2",
    "pylint>=4.0.5",
    "pylint-django>=2.7.0",
    "ruff>=0.15.4",
    "vulture>=2.16",
    "werkzeug>=3.1.5",
]
test = [
    "coveralls>=4.1.0",
    "freezegun>=1.4.0",
    "httpx>=0.27.0",
    "respx>=0.22.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "*/migrations/*",
    "registration/frontend/*",
    "venv",
    ".venv",
    "vulture_whitelist.py",  # intentionally bare names for vulture; not real code
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DJ", "SIM", "RUF"]
ignore = [
    "E203",    # whitespace-before-punctuation, conflicts with the formatter
    "RUF012",  # Django model/admin/form classes use mutable class attrs by design
               # (Meta, list_display, fields, fieldsets, actions); ClassVar is wrong here
    "DJ001",   # null=True on string fields: changing it requires a DB migration and
               # alters None/"" query semantics -- deliberate Phase C work, not a lint fix
    "DJ012",   # model body element ordering: pure convention, high churn, low value
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501", "RUF012"]
"registration/tests/*" = ["E501"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["registration", "fm_eventmanager"]
combine-as-imports = true

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = ['/migrations/', 'registration/frontend/']
# Introduced lenient; tighten in Phase C (check_untyped_defs, then disallow_untyped_defs).
check_untyped_defs = false
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "fm_eventmanager.settings"

[tool.pylint.main]
load-plugins = ["pylint_django"]
django-settings-module = "fm_eventmanager.settings"
ignore-paths = ["^.*/migrations/.*$", "^registration/frontend/.*$"]
jobs = 0

[tool.pylint."messages control"]
# Style/formatting is owned by ruff; keep pylint focused on semantics, design,
# and the cross-file duplicate-code (R0801) check ruff cannot do.
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "C0301",  # line-too-long (ruff/E501)
    "C0103",  # invalid-name (ruff/N, project uses camelCase model fields)
    "R0903",  # too-few-public-methods (noisy for Django models/forms)
    "W0511",  # fixme (TODO/FIXME comments are tracked elsewhere)
]

[tool.pylint.similarities]
min-similarity-lines = 8
ignore-imports = true
ignore-signatures = true

[tool.vulture]
paths = ["registration", "fm_eventmanager", "vulture_whitelist.py"]
exclude = ["*/migrations/*", "registration/frontend/*"]
min_confidence = 80

[tool.coverage.run]
branch = true
source = ["registration"]
omit = [
    "registration/migrations/*",
    "registration/tests/*",
    "registration/frontend/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"
