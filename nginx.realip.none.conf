# TRUSTED_PROXY_MODE=none
#
# nginx is the edge — there is no upstream proxy we trust. $remote_addr is
# already the real client peer IP (whatever connected to nginx's listener),
# so no realip module rewrite is needed.
#
# Used in:
#   - local docker-compose dev
#   - any deploy where the in-container nginx is internet-facing and TLS
#     terminates at nginx itself
#
# When in this mode an upstream LB MAY still TLS-offload to HTTP and pass an
# X-Forwarded-Proto header; the map below honors that hint when present, and
# otherwise reflects nginx's own $scheme.

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "https" "https";
    "http"  "http";
}

# No origin enforcement.
geo $trusted_origin {
    default 1;
}
