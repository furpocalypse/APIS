default_language_version:
  python: python3

exclude: venv/|static/

repos:
  # Ruff and ty are invoked through scripts/run-dev-tool.sh so the right
  # runner is picked per-OS: nix-shell on NixOS (PyPI's dynamically-linked
  # binaries don't run there without nix-ld), uv elsewhere.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: scripts/run-dev-tool.sh ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: scripts/run-dev-tool.sh ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-builtin-literals
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-ast
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: ty
        name: ty (type check payments modules)
        entry: scripts/run-dev-tool.sh ty check
        language: system
        pass_filenames: false
        files: ^registration/(payments|paypal_payments|paypal_webhook_handlers)\.py$
