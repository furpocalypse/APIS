# NGINX_SSL_MODE=off
#
# nginx terminates plaintext HTTP only. TLS is assumed to terminate upstream
# (Azure Front Door / Application Gateway / Cloudflare with HTTP origin).
# This is the default — appropriate for the Azure-fronted topology
# documented in CLAUDE.md and docker-compose.prod.yaml.
#
# Rendered at container boot by start.sh into /tmp/server.conf (read-only
# rootfs prevents writing back into /app/). nginx.conf includes that path.

server {
    listen 80 default_server;
    server_name _;

    # When TRUSTED_PROXY_MODE=proxy with FRONT_DOOR_ID set, $trusted_origin
    # is "0" for any request that didn't come from the trusted Front Door
    # instance. In TRUSTED_PROXY_MODE=none (or proxy without FRONT_DOOR_ID)
    # $trusted_origin is always "1" and this is a no-op.
    if ($trusted_origin = "0") { return 403; }

    location / {
        # Single trust-boundary write. Clients cannot inject any of these
        # headers because nginx unconditionally overwrites them. Note the
        # use of $remote_addr (one trustworthy value) NOT
        # $proxy_add_x_forwarded_for (which appends client-supplied data).
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $http_host;

        # Defang any other inbound trust headers an attacker might set.
        proxy_set_header Forwarded          "";
        proxy_set_header X-Real-Ip-Original "";

        proxy_pass http://unix:/tmp/apis.sock;
    }

    location /static/ {
        alias /app/apis/static/;
        add_header "Cache-Control" "max-age=31536000, immutable";
    }
}
