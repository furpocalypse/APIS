# Celery worker Deployment.
#
# Same image as the web pod but launched with the `worker` arg, which
# start.sh interprets as `celery -A fm_eventmanager worker --loglevel=info`
# (no gunicorn, no migrate). No HTTP probes — Celery's liveness signal
# is `inspect ping` on the worker control channel.
#
# Beat scheduler is NOT deployed: a grep of the codebase shows only
# @shared_task decorators, no @periodic_task / beat_schedule / crontab.
# All tasks are dispatched by web requests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apis-worker
  namespace: apis
  labels:
    app.kubernetes.io/name: apis
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apis
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apis
        app.kubernetes.io/component: worker
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: apis-app
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: furpocalypse.azurecr.io/apis:0.5.3
          imagePullPolicy: IfNotPresent
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: apis-config
            - secretRef:
                name: apis-secrets
          # Celery health: `inspect ping` returns "pong" from a live worker.
          # We use a generous startup probe so migrations on the web pod
          # have time to finish before the worker tries to pick up jobs
          # that touch new schema.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - 'celery -A fm_eventmanager inspect ping -d celery@$HOSTNAME --timeout=5 >/dev/null 2>&1'
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'celery -A fm_eventmanager inspect ping -d celery@$HOSTNAME --timeout=5 >/dev/null 2>&1'
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
            - name: kv-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: apis-kv
