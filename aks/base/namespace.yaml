apiVersion: v1
kind: Namespace
metadata:
  name: apis
  labels:
    name: apis
    # Pod Security Admission. "restricted" is the strictest profile and is
    # the right baseline for an app that handles PII + payments. Every pod
    # in this namespace must:
    #   - runAsNonRoot
    #   - drop ALL capabilities
    #   - have seccompProfile=RuntimeDefault
    #   - readOnlyRootFilesystem (or equivalent)
    # See ASVS V14.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Workload Identity opt-in for the namespace.
    azure.workload.identity/use: "true"
