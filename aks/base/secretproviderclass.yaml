# SecretProviderClass tells the Azure Key Vault Provider for Secrets Store
# CSI Driver which Key Vault entries to pull, and (via secretObjects) which
# of them to also sync into a regular Kubernetes Secret so the app can
# consume them as env vars via `envFrom`.
#
# Required AKS add-ons (enable once per cluster):
#   az aks enable-addons -a azure-keyvault-secrets-provider --name <c> --resource-group <rg>
#   az aks update --enable-oidc-issuer --enable-workload-identity -n <c> -g <rg>
#
# The CSI driver mounts at `/mnt/secrets-store` on the pod (see deployment).
# `syncSecret.enabled: true` is what lets the app reference them via env;
# without it the secrets are file-only.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: apis-kv
  namespace: apis
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "00000000-0000-0000-0000-000000000000"   # PLACEHOLDER — patched by overlay
    keyvaultName: "PLACEHOLDER-kv"                      # PLACEHOLDER — patched by overlay
    tenantId: "00000000-0000-0000-0000-000000000000"   # PLACEHOLDER — patched by overlay
    # Each `objectName` is the Key Vault secret name. The CSI mount path
    # becomes /mnt/secrets-store/<objectAlias>. secretObjects below project
    # the same values into a Kubernetes Secret for envFrom consumption.
    objects: |
      array:
        - |
          objectName: django-secret-key
          objectAlias: DJANGO_SECRET_KEY
          objectType: secret
        - |
          objectName: database-pass
          objectAlias: DATABASE_PASS
          objectType: secret
        - |
          objectName: postgres-password
          objectAlias: POSTGRES_PASSWORD
          objectType: secret
        - |
          objectName: bootstrap-admin-password
          objectAlias: BOOTSTRAP_ADMIN_PASSWORD
          objectType: secret
        - |
          objectName: paypal-client-id
          objectAlias: PAYPAL_CLIENT_ID
          objectType: secret
        - |
          objectName: paypal-client-secret
          objectAlias: PAYPAL_CLIENT_SECRET
          objectType: secret
        - |
          objectName: paypal-webhook-id
          objectAlias: PAYPAL_WEBHOOK_ID
          objectType: secret
        - |
          objectName: square-application-id
          objectAlias: SQUARE_APPLICATION_ID
          objectType: secret
        - |
          objectName: square-access-token
          objectAlias: SQUARE_ACCESS_TOKEN
          objectType: secret
        - |
          objectName: square-location-id
          objectAlias: SQUARE_LOCATION_ID
          objectType: secret
        - |
          objectName: square-webhook-signature-key
          objectAlias: SQUARE_WEBHOOK_SIGNATURE_KEY
          objectType: secret
        - |
          objectName: mqtt-jwt-secret
          objectAlias: MQTT_JWT_SECRET
          objectType: secret
        - |
          objectName: email-host-password
          objectAlias: EMAIL_HOST_PASSWORD
          objectType: secret
        - |
          objectName: sentry-dsn
          objectAlias: SENTRY_DSN
          objectType: secret
  # Projected into a Kubernetes Secret so the Deployment can do
  # `envFrom: secretRef`. Without this, the pod has files in
  # /mnt/secrets-store but no env vars set.
  secretObjects:
    - secretName: apis-secrets
      type: Opaque
      data:
        - objectName: DJANGO_SECRET_KEY
          key: DJANGO_SECRET_KEY
        - objectName: DATABASE_PASS
          key: DATABASE_PASS
        - objectName: POSTGRES_PASSWORD
          key: POSTGRES_PASSWORD
        - objectName: BOOTSTRAP_ADMIN_PASSWORD
          key: BOOTSTRAP_ADMIN_PASSWORD
        - objectName: PAYPAL_CLIENT_ID
          key: PAYPAL_CLIENT_ID
        - objectName: PAYPAL_CLIENT_SECRET
          key: PAYPAL_CLIENT_SECRET
        - objectName: PAYPAL_WEBHOOK_ID
          key: PAYPAL_WEBHOOK_ID
        - objectName: SQUARE_APPLICATION_ID
          key: SQUARE_APPLICATION_ID
        - objectName: SQUARE_ACCESS_TOKEN
          key: SQUARE_ACCESS_TOKEN
        - objectName: SQUARE_LOCATION_ID
          key: SQUARE_LOCATION_ID
        - objectName: SQUARE_WEBHOOK_SIGNATURE_KEY
          key: SQUARE_WEBHOOK_SIGNATURE_KEY
        - objectName: MQTT_JWT_SECRET
          key: MQTT_JWT_SECRET
        - objectName: EMAIL_HOST_PASSWORD
          key: EMAIL_HOST_PASSWORD
        - objectName: SENTRY_DSN
          key: SENTRY_DSN
