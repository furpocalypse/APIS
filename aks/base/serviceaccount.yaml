# Service account bound to an Azure user-assigned Managed Identity via
# AKS Workload Identity. The MI must be federated to this service account
# (subject: system:serviceaccount:apis:apis-app) AND granted:
#   - AcrPull on furpocalypse.azurecr.io
#   - Key Vault Secrets User on the Key Vault that backs SecretProviderClass
#
# Federation setup (run once, outside k8s):
#   az identity federated-credential create \
#     --name apis-app-fic \
#     --identity-name apis-app-mi \
#     --resource-group <rg> \
#     --issuer "$(az aks show -g <rg> -n <cluster> --query oidcIssuerProfile.issuerUrl -o tsv)" \
#     --subject system:serviceaccount:apis:apis-app \
#     --audience api://AzureADTokenExchange
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apis-app
  namespace: apis
  annotations:
    # PLACEHOLDER: replace with the clientId of the user-assigned MI.
    # Overlays patch this; do NOT commit a real GUID here.
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
    # AcrPull scope hint for the Workload Identity webhook.
    azure.workload.identity/tenant-id: "00000000-0000-0000-0000-000000000000"
  labels:
    azure.workload.identity/use: "true"
