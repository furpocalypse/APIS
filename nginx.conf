daemon off;
error_log /app/log/nginx/error.log warn;
pid /tmp/nginx.pid;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Real-client-IP plumbing. Rendered at container boot from
    # nginx.realip.<TRUSTED_PROXY_MODE>.conf (see start.sh). Defines:
    #   - $forwarded_proto  : the scheme to forward to Django (http|https)
    #   - $trusted_origin   : "1" if the request came from a trusted edge
    #                         (either no enforcement, or matching FDID +
    #                         trusted-proxy CIDR); "0" otherwise.
    # In TRUSTED_PROXY_MODE=proxy, this snippet also runs the realip module
    # so $remote_addr is rewritten to the real client IP before it is read
    # below.
    # Rendered at boot by start.sh into the tmpfs at /tmp (the rest of
    # /app is read-only at runtime under CIS Docker 5.12).
    include /tmp/realip.conf;

    log_format main  '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" xff="$http_x_forwarded_for" '
                     'fdid="$http_x_azure_fdid"';
    access_log /app/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Cap form posts. Today defaults to 1m, which is too tight for the cart
    # form (signature_bitmap is base64-encoded PNG). Bound it explicitly so
    # we can't be flooded with arbitrarily large bodies, either.
    client_max_body_size 4m;
    client_body_buffer_size 64k;

    # Hide upstream identifying details.
    server_tokens off;

    server {
        listen 80 default_server;
        server_name _;

        # When TRUSTED_PROXY_MODE=proxy with FRONT_DOOR_ID set, $trusted_origin
        # is "0" for any request that didn't come from the trusted Front Door
        # instance. In TRUSTED_PROXY_MODE=none (or proxy without FRONT_DOOR_ID)
        # $trusted_origin is always "1" and this is a no-op.
        if ($trusted_origin = "0") { return 403; }

        location / {
            # Single trust-boundary write. Clients cannot inject any of these
            # headers because nginx unconditionally overwrites them. Note the
            # use of $remote_addr (one trustworthy value) NOT
            # $proxy_add_x_forwarded_for (which appends client-supplied data).
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host  $http_host;

            # Defang any other inbound trust headers an attacker might set.
            proxy_set_header Forwarded          "";
            proxy_set_header X-Real-Ip-Original "";

            proxy_pass http://unix:/tmp/apis.sock;
        }

        location /static/ {
            alias /app/apis/static/;
            add_header "Cache-Control" "max-age=31536000, immutable";
        }
    }
}
