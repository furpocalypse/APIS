daemon off;
error_log /app/log/nginx/error.log warn;
pid /tmp/nginx.pid;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Real-client-IP plumbing. Rendered at container boot from
    # nginx.realip.<TRUSTED_PROXY_MODE>.conf (see start.sh). Defines:
    #   - $forwarded_proto  : the scheme to forward to Django (http|https)
    #   - $trusted_origin   : "1" if the request came from a trusted edge
    #                         (either no enforcement, or matching FDID +
    #                         trusted-proxy CIDR); "0" otherwise.
    # In TRUSTED_PROXY_MODE=proxy, this snippet also runs the realip module
    # so $remote_addr is rewritten to the real client IP before it is read
    # below.
    # Rendered at boot by start.sh into the tmpfs at /tmp (the rest of
    # /app is read-only at runtime under CIS Docker 5.12).
    include /tmp/realip.conf;

    log_format main  '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" xff="$http_x_forwarded_for" '
                     'fdid="$http_x_azure_fdid"';
    access_log /app/log/nginx/access.log main;

    # Pin every temp path nginx might want to write to into /tmp. Without
    # this nginx falls back to its compile-time defaults under
    # /var/lib/nginx/* — those would require an additional tmpfs mount
    # under read-only rootfs, and the short-form `tmpfs:` syntax in some
    # Docker versions silently drops the uid=/gid= options, breaking the
    # mount. /tmp is the one tmpfs we guarantee exists writable as uid
    # 1000 in every topology (compose dev/prod, AKS, docker run).
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    scgi_temp_path        /tmp/nginx-scgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;

    sendfile on;
    keepalive_timeout 65;

    # Cap form posts. Today defaults to 1m, which is too tight for the cart
    # form (signature_bitmap is base64-encoded PNG). Bound it explicitly so
    # we can't be flooded with arbitrarily large bodies, either.
    client_max_body_size 4m;
    client_body_buffer_size 64k;

    # Hide upstream identifying details.
    server_tokens off;

    # Server block(s) rendered at container boot from
    # nginx.server.<NGINX_SSL_MODE>.conf{,.template} (see start.sh):
    #   - off (default): plaintext-only port 80 server
    #   - on            : port 80 -> 443 redirect + HTTPS terminator on 443
    # Rendered to /tmp/server.conf because /app is read-only at runtime
    # under CIS Docker 5.12.
    include /tmp/server.conf;
}
