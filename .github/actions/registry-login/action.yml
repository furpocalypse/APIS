# Composite action — conditional, SHA-pinned Docker Hub read-only login.
#
# S1(d)/S31: the CI test/e2e jobs pull service-container images
# (postgres, gotenberg) from Docker Hub at job-init. An authenticated
# pull raises the anonymous rate-limit ceiling. But on PRs from forks (or
# any context where DOCKER_USERNAME is unset) the secret is empty, and an
# unconditional docker/login-action hard-fails with "Username and
# password required" — the root cause of the build (3.13/3.14) failures.
#
# This action logs in ONLY when the credential is present, so it is a
# safe no-op without secrets and never hard-fails. Factored here (rather
# than copy-pasted into django.yml + e2e.yml) so the conditional-login
# concern has exactly one owner. docker.yml (GHCR push via GITHUB_TOKEN)
# is a different concern and intentionally does NOT use this.
#
# The durable rate-limit fix (mirror service images through Google
# Artifact Registry / GHCR pull-through) is S31, deferred to ops infra
# provisioning and explicitly NOT a gate on CI going green.
name: registry-login
description: Conditional, SHA-pinned read-only Docker Hub login (no-op when unauthenticated).

inputs:
  username:
    description: Docker Hub username (empty = skip login).
    required: false
    default: ""
  password:
    description: Docker Hub password/token.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Docker Hub login (read-only, only when credentialed)
      if: ${{ inputs.username != '' }}
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
