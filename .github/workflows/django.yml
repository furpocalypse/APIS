name: Django CI

on:
  push:
    branches: [production, stage]
  pull_request:
    branches: [production, stage]

# CodeQL actions/missing-workflow-permissions: least privilege. Tests +
# coveralls submission need read only (coveralls posts to coveralls.io).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.13", "3.14"]

    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: mirror.gcr.io/library/postgres
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

      gotenberg:
        image: mirror.gcr.io/gotenberg/gotenberg:8
        options: >-
          --health-cmd "curl --fail http://localhost:3000/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3000:3000

      # settings_base wires cache / sessions(cached_db) / celery /
      # idempotency-lock / maintenance-mode to Redis (the canonical
      # `make test` path uses it via docker-compose). The build job had
      # no Redis service -> ~1600 "connecting to redis: name resolution"
      # errors. Mirror the e2e/Makefile expectation.
      redis:
        image: mirror.gcr.io/library/redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      # S1/S31: service + base images are pulled from Google's public
      # mirror (mirror.gcr.io) — no auth, far higher pull limits than
      # anonymous Docker Hub. No registry login step is needed at all
      # (fixes the original "Username and password required" failure and
      # removes the rate-limit exposure durably, per user directive).
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install Dependencies
        run: |
          uv sync --all-groups
      - name: Build frontend
        run: |
          cd registration/frontend
          npm install
          npm run build
      - name: Run frontend tests
        working-directory: registration/frontend
        run: npm run test:run
      - name: Load .env.ci into the job environment
        # Decision #11: there is no settings_test module. The single
        # canonical settings.py is driven by the tracked, secret-free,
        # fully-independent .env.ci (APIS_ENV=ci). Append its KEY=value
        # lines (sans comments/blanks) to $GITHUB_ENV so subsequent steps
        # see them. Real sandbox secrets are injected separately below.
        run: grep -vE '^[[:space:]]*#|^[[:space:]]*$' .env.ci >> "$GITHUB_ENV"
      - name: Run Tests
        run: |
          uv run python ./manage.py collectstatic --noinput
          uv run coverage run ./manage.py test registration
          uv run coverage report --fail-under=${COVERAGE_FAIL_UNDER}
        env:
          # Secrets cannot live in tracked .env.ci — inject from GitHub
          # Actions secrets (sandbox creds; settings.py reads them via
          # os.environ.get(..., "") so absence is a safe sandbox default).
          SQUARE_APPLICATION_ID: ${{ secrets.SQUARE_APPLICATION_ID }}
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      - name: Submit coverage
        run: uv run coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
