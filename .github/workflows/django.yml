name: Django CI

on:
  push:
    branches: [production, stage]
  pull_request:
    branches: [production, stage]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.13", "3.14"]

    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

      gotenberg:
        image: gotenberg/gotenberg:8
        options: >-
          --health-cmd "curl --fail http://localhost:3000/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3000:3000

      # settings_base wires cache / sessions(cached_db) / celery /
      # idempotency-lock / maintenance-mode to Redis (the canonical
      # `make test` path uses it via docker-compose). The build job had
      # no Redis service -> ~1600 "connecting to redis: name resolution"
      # errors. Mirror the e2e/Makefile expectation.
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Docker Hub login (conditional, read-only)
        uses: ./.github/actions/registry-login
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
      - name: Install Dependencies
        run: |
          uv sync --all-groups
      - name: Build frontend
        run: |
          cd registration/frontend
          npm install
          npm run build
      - name: Run frontend tests
        working-directory: registration/frontend
        run: npm run test:run
      - name: Run Tests
        run: |
          # settings_test.py is the canonical test settings; no copy needed.
          # The Django test runner picks up DJANGO_SETTINGS_MODULE; we set
          # it explicitly below.
          uv run python ./manage.py collectstatic --noinput
          uv run coverage run ./manage.py test registration
          uv run coverage report --fail-under=${COVERAGE_FAIL_UNDER}
        env:
          # S1(c): the PR removed the `cp settings.py.ci settings.py` line but
          # never set DJANGO_SETTINGS_MODULE, so collectstatic/test would
          # ImproperlyConfigured (manage.py defaults to the now-untracked
          # fm_eventmanager.settings). settings_test is canonical for CI.
          DJANGO_SETTINGS_MODULE: fm_eventmanager.settings_test
          # D-COV: enforce the measured baseline (recorded in plan Findings;
          # captured from the first green run, then pinned > 0).
          COVERAGE_FAIL_UNDER: "0"
          # Ergonomic test posture (matches the retired settings.py.ci:
          # DEBUG=True) so settings_base's DEBUG-gated defaults apply and the
          # !DEBUG SSL-redirect/secure-cookie block does not break the test
          # client. Strict prod assertions stay keyed off APIS_ENV (unset).
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: ci-test-secret
          ALLOWED_HOSTS: "testserver,localhost,127.0.0.1"
          CSRF_TRUSTED_ORIGINS: "http://testserver,http://localhost,http://127.0.0.1"
          TRUSTED_CLIENT_IP_HEADER: ""
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USER: postgres
          DATABASE_PASS: postgres
          DATABASE_NAME: postgres
          DJANGO_DATABASE_POOL: "False"
          STATIC_ROOT: /tmp/apis-ci-static
          GOTENBERG_HOST: http://localhost:3000
          DJANGO_REDIS_URL: redis://localhost:6379/1
          CELERY_BROKER_URL: redis://localhost:6379/2
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          IDEMPOTENCY_KEY_LOCK_LOCATION: redis://localhost:6379
          SQUARE_APPLICATION_ID: ${{ secrets.SQUARE_APPLICATION_ID }}
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      - name: Submit coverage
        run: uv run coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
