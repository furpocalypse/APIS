name: Django CI

on:
  push:
    branches: [production, stage]
  pull_request:
    branches: [production, stage]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.13", "3.14"]

    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

      gotenberg:
        image: gotenberg/gotenberg:8
        options: >-
          --health-cmd "curl --fail http://localhost:3000/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3000:3000

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Login to Docker Hub (read-only)
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
      - name: Install Dependencies
        run: |
          uv sync
      - name: Build frontend
        run: |
          cd registration/frontend
          npm install
          npm run build
      - name: Run frontend tests
        working-directory: registration/frontend
        run: npm run test:run
      - name: Run Tests
        run: |
          # settings_test.py is the canonical test settings; no copy needed.
          # The Django test runner picks up DJANGO_SETTINGS_MODULE; we set
          # it explicitly below.
          uv run python ./manage.py collectstatic --noinput
          uv run coverage run ./manage.py test registration
        env:
          SQUARE_APPLICATION_ID: ${{ secrets.SQUARE_APPLICATION_ID }}
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      - name: Submit coverage
        run: uv run coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
