---
name: Lint
on:
  push:
    branches:
      - production
      - stage
  pull_request:
    branches:
      - production
      - stage
permissions:
  contents: read
jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Install dependencies
        run:
          - uv sync
          - uv python install 3.14
          - uv python pin 3.14
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: status-writer gate (no raw Order.status in views)
        run: make lint-status-writers
      - name: S20 module-level env-read sweep
        run: make lint-env-sweep
  mypy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Install dependencies
        run:
          - uv sync
          - uv python install 3.14
          - uv python pin 3.14
      - name: Load .env.ci into the job environment
        run: grep -vE '^[[:space:]]*#|^[[:space:]]*$' .env.ci >> "$GITHUB_ENV"
      - name: mypy
        run: uv run mypy registration fm_eventmanager
  pylint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Install dependencies
        run:
          - uv sync
          - uv python install 3.14
          - uv python pin 3.14
      - name: Load .env.ci into the job environment
        run: grep -vE '^[[:space:]]*#|^[[:space:]]*$' .env.ci >> "$GITHUB_ENV"
      - name: pylint (semantics + duplicate-code/R0801)
        run: uv run pylint registration --fail-under=9.0
  vulture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Install dependencies
        run:
          - uv sync
          - uv python install 3.14
          - uv python pin 3.14
      - name: vulture (dead code)
        run: uv run vulture
