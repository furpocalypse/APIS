name: Playwright E2E

on:
  push:
    branches: [production, stage]
  pull_request:
    branches: [production, stage]

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: mirror.gcr.io/library/postgres
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_USER: apis
          POSTGRES_DB: apis
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: mirror.gcr.io/library/redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      gotenberg:
        image: mirror.gcr.io/gotenberg/gotenberg:8
        options: >-
          --health-cmd "curl --fail http://localhost:3000/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3000:3000

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Python deps
        run: uv sync --all-groups

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/playwright/package.json') }}

      - name: Install Playwright + browsers
        working-directory: e2e/playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium firefox

      # S4: the PR's comment-only `run:` is an empty script (actionlint /
      # yamllint violation, can fail the job) — step deleted entirely.
      # settings selection is solely via DJANGO_SETTINGS_MODULE, which
      # e2e/playwright/scripts/up.sh exports; it is also pinned in the
      # Run Playwright suite env below for explicitness.

      - name: Build frontend
        working-directory: registration/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Run Playwright suite
        env:
          # Decision #11: single canonical module; up.sh sources .env.test
          # for the full posture. Set here too so it is correct even before
          # up.sh runs.
          DJANGO_SETTINGS_MODULE: fm_eventmanager.settings
          TEST_DATABASE_HOST: 127.0.0.1
          TEST_DATABASE_PORT: 5432
          TEST_DATABASE_USER: apis
          TEST_DATABASE_PASS: secret
          TEST_DATABASE_NAME: apis_e2e
          TEST_REDIS_HOST: 127.0.0.1
          TEST_REDIS_PORT: 6379
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID || 'test' }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET || 'test' }}
          PAYPAL_WEBHOOK_ID: test-webhook
          SQUARE_APPLICATION_ID: ${{ secrets.SQUARE_APPLICATION_ID || 'test' }}
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN || 'test' }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID || 'test' }}
        run: make e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: e2e/playwright/playwright-report/
          retention-days: 14

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apis-e2e-server-log
          path: e2e/playwright/server.log
          if-no-files-found: ignore
          retention-days: 14
