name: Build & Deploy

on:
  # Manually triggered from the UI
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: environment

  # Dependency to a forking workflow
  #workflow_run:
  #  workflows: ["Django CI"]
  #  types: [completed]

# CodeQL actions/missing-workflow-permissions: least privilege. The build
# pushes images to ghcr.io (packages:write); nothing writes repo contents.
permissions:
  contents: read
  packages: write

jobs:
  build_docker:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    concurrency: ${{ github.event.inputs.environment }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Login to packages container registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build image
      run: |
        make build-docker-image
        make tag-${{ github.event.inputs.environment }}

    - name: Deploy to server
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
      with:
        host: maaa-registration
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        proxy_host: ${{ secrets.SSH_HOST }}
        proxy_username: ${{ secrets.SSH_USERNAME }}
        proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /opt/docker
          docker-compose pull
          docker-compose up -d apis-${{ github.event.inputs.environment }} apis-${{ github.event.inputs.environment }}-worker
