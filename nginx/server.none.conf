# TRUSTED_PROXY_MODE=none
#
# No upstream proxy trust. nginx is the edge but doesn't terminate TLS
# in this mode either — useful for local testing where you'd hit the
# container on plain HTTP. For real exposure use TRUSTED_PROXY_MODE=
# cloudflare (which DOES terminate TLS).

server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        return 204;
    }

    location / {
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Variable upstream + the http-block resolver = per-request DNS.
        set $upstream "${NGINX_UPSTREAM}";
        proxy_pass http://$upstream;
    }
}
