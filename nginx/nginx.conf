# APIS reverse-proxy: HTTP preamble. Mode-specific server block is
# rendered at boot into /tmp/server.conf by entrypoint.sh based on
# TRUSTED_PROXY_MODE (cloudflare / proxy / none).
#
# This image is intended for the Docker / docker-compose topology only.
# In AKS we don't deploy this — Application Gateway Ingress Controller
# terminates TLS at the gateway and forwards plaintext to the app
# service. The app's TCP listener (gunicorn :8000) is what AGIC reaches.

# daemon off; is supplied by the Dockerfile CMD via `-g 'daemon off;'`
# — declaring it here too would error with "directive is duplicate".
error_log /dev/stderr warn;
pid       /tmp/nginx.pid;
worker_processes auto;

# Raise the per-worker open-file limit so worker_connections below can
# actually open that many sockets. Default container ulimit is 1024,
# and each connection needs 2 fds (client + upstream), so the limit
# needs to be >= 2 * worker_connections plus a small buffer for logs.
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main  '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" cf-ray="$http_cf_ray" '
                     'cf-ip="$http_cf_connecting_ip" '
                     'xff="$http_x_forwarded_for"';
    access_log /dev/stdout main;

    # Pin every temp path nginx writes to under /tmp. nginx:alpine's
    # nginx user (uid 101) has no writable rootfs paths under
    # /var/lib/nginx unless an explicit tmpfs is mounted there, so /tmp
    # is the safe bet — guaranteed writable in every deployment.
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    scgi_temp_path        /tmp/nginx-scgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;

    sendfile   on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Cap form posts. Today defaults to 1m, which is too tight for the
    # cart form (signature_bitmap is base64-encoded PNG). Bound explicitly
    # so we can't be flooded with arbitrarily large bodies either.
    client_max_body_size    4m;
    client_body_buffer_size 64k;

    server_tokens off;

    # --- TLS profile (shared by every HTTPS server below) ---------------
    # OWASP Transport Layer Protection: TLS 1.2+, AEAD ciphers preferred,
    # server-chosen ordering. CHACHA20 included for mobile clients.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Docker's embedded DNS resolver. Used by server blocks below so the
    # `app` service is resolved per-request rather than at config-load
    # time (which would fail nginx -t when the container is tested
    # outside the compose network). 127.0.0.11 is the docker daemon's
    # internal DNS; ipv6=off keeps logs clean for IPv4-only deploys.
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    # --- Mode-specific http-level realip / geo --------------------------
    # Rendered by entrypoint.sh:
    #   cloudflare -> set_real_ip_from CF ranges + real_ip_header
    #                 CF-Connecting-IP + `geo $cf_source_ip` allowlist
    #   proxy      -> set_real_ip_from from TRUSTED_PROXY_CIDRS +
    #                 real_ip_header from CLIENT_IP_HEADER
    #   none       -> empty
    include /tmp/realip-http.conf;

    # --- Mode-specific server block(s) ----------------------------------
    # Rendered by entrypoint.sh. The server blocks reach the app via
    # `set $upstream "${NGINX_UPSTREAM}"; proxy_pass http://$upstream;`
    # — variable-based so the resolver above does the lookup at request
    # time, which lets nginx -t pass outside the compose network.
    include /tmp/server.conf;
}
