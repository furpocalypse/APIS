# TRUSTED_PROXY_MODE=cloudflare (the default for this image)
#
# Cloudflare proxied DNS in front. nginx terminates TLS at the origin
# (Cloudflare's "Full (Strict)" SSL mode requires this). Two listeners:
#
#   - Port 80  : redirect to HTTPS (Cloudflare's "Always Use HTTPS"
#                rule does this at the edge too; this is the in-cluster
#                fallback for any HTTP hits that slip through.)
#   - Port 443 : HTTPS terminator with the cert at /app/certs/. Real
#                client IP comes from CF-Connecting-IP. Source IPs are
#                restricted to Cloudflare's published CIDR ranges
#                (see cloudflare-ips.conf, included unconditionally
#                because the geo block has to live in the http block).
#
# Companion file: cloudflare-ips.conf is included from the http block via
# entrypoint.sh (rendering it as a top-level include in nginx.conf when
# this mode is selected).

# --- HTTP listener (80) — redirect to HTTPS -----------------------------
server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Cloudflare may health-check on HTTP; let /healthz answer cheap.
    location = /healthz {
        access_log off;
        return 204;
    }

    return 301 https://$host$request_uri;
}

# --- HTTPS listener (443) ----------------------------------------------
server {
    listen      443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name ${NGINX_SERVER_NAMES};

    # Origin-IP lock-down. Drop anything that didn't come from
    # Cloudflare's published CIDRs (set via cloudflare-ips.conf's geo
    # block). This is the defense-in-depth layer against attackers who
    # guess your origin IP and try to bypass the WAF.
    if ($cf_source_ip = 0) { return 403; }

    ssl_certificate     /app/certs/fullchain.pem;
    ssl_certificate_key /app/certs/privkey.pem;

    # HSTS (also set by Django on dynamic responses; here for /static/).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        return 204;
    }

    location / {
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $http_host;

        # Defang any other inbound trust headers an attacker might set.
        proxy_set_header Forwarded          "";
        proxy_set_header X-Real-Ip-Original "";

        # Bound the proxy hop so a stuck app doesn't tie up the whole
        # worker pool indefinitely.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Variable upstream + the http-block resolver = per-request DNS
        # lookup. Lets nginx -t pass outside the compose network.
        set $upstream "${NGINX_UPSTREAM}";
        proxy_pass http://$upstream;
    }
}
