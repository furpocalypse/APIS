# --------------------------------------------------------------------------
# APIS — Development compose file (the default).
#
# Boot styles:
#
#     docker compose up -d                  # dev — uses this file
#     docker compose -f docker-compose.prod.yaml up -d   # production
#
# Differences from docker-compose.prod.yaml:
#   * Builds the image locally from ./Dockerfile (no ACR pull).
#   * Bind-mounts the source tree so edits to registration/ and
#     fm_eventmanager/settings.py hot-reload without rebuilding the image.
#   * No runtime hardening (cap_drop / read_only / tmpfs) — these slow
#     iteration without giving you anything for a single-machine dev loop.
#   * Postgres + Redis use named Docker volumes — `docker compose down -v`
#     wipes them, which is the right behaviour for dev.
#
# REQUIRED before `docker compose up`:
#   - `.env.dev`       (copy from .env.dev.example, adjust if needed)
#   - `database.env`   (copy from database.env.example; DB creds must
#                       match DATABASE_USER / DATABASE_PASS in .env.dev)
#
# Optional monitoring stack (InfluxDB 3 + Prometheus + node-exporter +
# Grafana): bring up with the overlay --
#     docker compose -f docker-compose.yaml -f docker-compose.monitoring.yaml up -d
# See setup-monitoring.sh for the supporting config files.
# --------------------------------------------------------------------------

services:
  app:
    build: .
    image: apis:dev
    restart: unless-stopped
    ports:
      # gunicorn is exposed directly in dev — no nginx sidecar. Skip the
      # nginx layer locally; it adds nothing for hot-reload iteration.
      # The prod compose runs apis-nginx in front (TLS + Cloudflare gate).
      - "8000:8000"
    volumes:
      # Hot-mount source so edits don't require a rebuild. Strictly dev-only;
      # the prod compose file omits these mounts so the image-baked code is
      # canonical.
      - ./registration:/app/registration
      - ./fm_eventmanager/settings.py:/app/fm_eventmanager/settings.py
      - ./media:/app/apis/media
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    env_file:
      - .env.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    image: apis:dev
    command: worker
    restart: unless-stopped
    volumes:
      - ./registration:/app/registration
      - ./fm_eventmanager:/app/fm_eventmanager
      - ./media:/app/media
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    env_file:
      - .env.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: mirror.gcr.io/library/postgres:16
    restart: unless-stopped
    env_file:
      - database.env
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: mirror.gcr.io/library/redis:8
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --save 60 1
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  gotenberg:
    profiles: [gotenberg]
    image: mirror.gcr.io/gotenberg/gotenberg:8
    restart: unless-stopped

volumes:
  database-data:
  redis-data:
