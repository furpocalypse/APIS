[supervisord]
nodaemon=true
# Read-only root filesystem (CIS Docker 5.12) means supervisord can't
# write its default ./supervisord.log under WORKDIR=/app. Route logs
# to stdout (picked up by `docker logs` / Container Apps log stream)
# and the pidfile to the /tmp tmpfs.
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:gunicorn]
# --forwarded-allow-ips=* is safe here because the upstream is a unix domain
# socket on the local filesystem; only the in-container nginx (running as
# the same `apis` user) can connect. Without this, uvicorn would refuse to
# honor X-Forwarded-For / X-Forwarded-Proto from nginx — see Task 3 analysis
# and ASVS V13.1.4.
command=gunicorn fm_eventmanager.asgi:application -k fm_eventmanager.worker.ApisWorker --bind unix:/tmp/apis.sock --forwarded-allow-ips=*
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=1
autorestart=false

[program:nginx]
command=/usr/sbin/nginx -c /app/nginx.conf
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT
startsecs=1
autorestart=false

[eventlistener:quit_on_failure]
events=PROCESS_STATE_STOPPED,PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
command=bash -c "printf 'READY\n' && while read line; do kill -SIGQUIT $PPID; done < /dev/stdin"
